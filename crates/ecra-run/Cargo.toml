[package]
name = "ecra-run"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ecra-core = { path = "../ecra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.11"
thiserror = "2"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
zip = { version = "=8.6.0", default-features = false }

[dev-dependencies]
proptest = "=1.11.0"
tempfile = "=3.27.0"
