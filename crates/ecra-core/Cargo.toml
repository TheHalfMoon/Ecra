[package]
name = "ecra-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }
serde_jcs = "0.2"
sha2 = "0.11"

[dev-dependencies]
proptest = "1"
