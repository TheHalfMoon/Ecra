name: ECR-002 Phase 3 one-shot runner

on:
  push:
    branches:
      - 002-durable-run-ledger

permissions:
  contents: write

jobs:
  materialize-phase3:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Materialize Phase 3 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ecra-phase3
          mkdir -p /tmp/ecra-phase3
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path
          helper = Path('.github/workflows/ecr-002-phase3-materializer.yml').read_text()
          match = re.search(r"PHASE3_PAYLOAD: '([^']+)'", helper)
          if match is None:
              raise SystemExit('phase3 payload not found in one-shot materializer')
          Path('/tmp/ecra-phase3.tgz').write_bytes(base64.b64decode(match.group(1)))
          PY
          tar -xzf /tmp/ecra-phase3.tgz -C /tmp/ecra-phase3
          cp /tmp/ecra-phase3/state.rs crates/ecra-run/src/state.rs
          cp /tmp/ecra-phase3/recovery.rs crates/ecra-run/src/recovery.rs
          cp /tmp/ecra-phase3/lib.rs crates/ecra-run/src/lib.rs
          cp /tmp/ecra-phase3/reducer.rs crates/ecra-run/tests/reducer.rs
          cp /tmp/ecra-phase3/attempts.rs crates/ecra-run/tests/attempts.rs
          cp /tmp/ecra-phase3/portability.rs crates/ecra-run/tests/portability.rs
          cp /tmp/ecra-phase3/STATUS.md specs/002-durable-run-ledger/STATUS.md
          cp /tmp/ecra-phase3/EXECUTION.md EXECUTION.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/002-durable-run-ledger/tasks.md')
          text = path.read_text()
          for task in range(1, 19):
              old = f'- [ ] T{task:03d}'
              new = f'- [x] T{task:03d}'
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one task marker: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Verify focused Phase 3 gate before commit
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p ecra-run --test event_contract --locked
          cargo test -p ecra-run --test reducer --locked
          cargo test -p ecra-run --test attempts --locked
          cargo test -p ecra-run --test portability --locked
          cargo test -p ecra-run --locked
      - name: Commit Phase 3 and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ecr-002-phase3-materializer.yml
          rm .github/workflows/ecr-002-phase3-runner.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/ecr-002-phase3-materializer.yml',
              '.github/workflows/ecr-002-phase3-runner.yml',
              'EXECUTION.md',
              'crates/ecra-run/src/lib.rs',
              'crates/ecra-run/src/recovery.rs',
              'crates/ecra-run/src/state.rs',
              'crates/ecra-run/tests/attempts.rs',
              'crates/ecra-run/tests/portability.rs',
              'crates/ecra-run/tests/reducer.rs',
              'specs/002-durable-run-ledger/STATUS.md',
              'specs/002-durable-run-ledger/tasks.md',
          }
          output = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True)
          changed = {line[3:] for line in output.splitlines() if line}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected changed paths: {sorted(unexpected)}')
          required = allowed - {
              '.github/workflows/ecr-002-phase3-materializer.yml',
              '.github/workflows/ecr-002-phase3-runner.yml',
          }
          missing = required - changed
          if missing:
              raise SystemExit(f'expected Phase 3 paths not changed: {sorted(missing)}')
          PY
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git commit -m 'feat(run): implement pure reducer state machine'
          git push origin HEAD:002-durable-run-ledger
