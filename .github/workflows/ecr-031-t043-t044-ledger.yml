name: ECR-031 T043-T044 ledger convergence

on:
  push:
    branches:
      - 031-identity-trust-root

permissions:
  contents: write

jobs:
  converge-ledger:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Converge T043-T044 evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0f84b2215529442cf7efbd1d3fa2892f224e6e6e"
          python3 .github/scripts/ecr031_t043_t044_ledger.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/031-identity-trust-root/tasks.md specs/031-identity-trust-root/STATUS.md EXECUTION.md
          git rm .github/workflows/ecr-031-t043-t044-ledger.yml .github/scripts/ecr031_t043_t044_ledger.py
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m "docs(identity): record T043 T044 exact-head evidence"
          git push origin HEAD:031-identity-trust-root
