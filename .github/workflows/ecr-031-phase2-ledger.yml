name: ECR-031 Phase 2 Closure Ledger

on:
  push:
    branches:
      - 031-identity-trust-root

permissions:
  contents: write

jobs:
  close-phase2-ledger:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact verified Phase 2 parent
        shell: bash
        run: |
          set -euo pipefail
          parent='4ddb6da267ebc90647e27fde382385a9d2529452'
          git merge-base --is-ancestor "$parent" HEAD
          delta="$(git diff --name-only "$parent"..HEAD)"
          test "$delta" = '.github/workflows/ecr-031-phase2-ledger.yml'

      - name: Converge Phase 2 task and status ledgers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tasks = Path('specs/031-identity-trust-root/tasks.md')
          text = tasks.read_text()
          for number in range(11, 21):
              old = f'- [ ] **T{number:03d}**'
              new = f'- [x] **T{number:03d}**'
              if old not in text:
                  raise SystemExit(f'missing incomplete marker for T{number:03d}')
              text = text.replace(old, new, 1)
          tasks.write_text(text)

          status = Path('specs/031-identity-trust-root/STATUS.md')
          text = status.read_text()
          marker = '## Phase 2 verified closure evidence'
          if marker in text:
              raise SystemExit('Phase 2 evidence already present')
          text = text.rstrip() + '''\n\n## Phase 2 verified closure evidence\n\nPhase 2 T011–T020 is verified on exact head `4ddb6da267ebc90647e27fde382385a9d2529452`. Permanent ECR-031 CI run `33163366128`, job `98822931741`, completed `SUCCESS` with all steps green.\n\n```text\nVERIFIED_PHASE2_HEAD      4ddb6da267ebc90647e27fde382385a9d2529452\nECR031_CI_RUN             33163366128\nECR031_CI_JOB             98822931741\nECR031_CI_RESULT          SUCCESS\nT011-T012                 strong UUID-backed IDs + compile/type separation\nT013                      closed redacted identity errors\nT014-T015                 closed algorithm/lifecycle enums + strict v1 version gate\nT016-T017                 pre-crypto byte/depth/count limits + valid/invalid fixture corpus\nT018-T019                 ecra-core JCS reuse + domain-separated SHA-256 + fixed goldens\nT020                      exact-head Phase 2 gate complete\n```\n\nThe successful gate covered locked workspace build, rustfmt, strict Clippy, workspace tests, ECR-001/ECR-002 regressions, explicit ECR-031 assertion/validation/anchor targets, rustdoc, offline replay, core/run/identity unsafe+dependency boundaries, and dependency/toolchain evidence. Phase 2 introduces no authorization, browser/model/network/provider/protocol/process behavior and no native-backend verification claim.\n\n## Phase 3 execution frontier\n\nPhase 3 becomes eligible only after this record-only Phase 2 ledger-convergence head itself passes permanent ECR-031 CI. Once that exact closure head is green, continue T021–T034 strictly in dependency order. No Phase 3 API may introduce ambient issuance or caller-selected subject substitution, and validation remains identity/trust evidence rather than authorization.\n'''
          status.write_text(text)
          PY

      - name: Commit record-only closure ledger and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ecr-031-phase2-ledger.yml
          git add \
            .github/workflows/ecr-031-phase2-ledger.yml \
            specs/031-identity-trust-root/tasks.md \
            specs/031-identity-trust-root/STATUS.md
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/ecr-031-phase2-ledger.yml' \
            'specs/031-identity-trust-root/STATUS.md' \
            'specs/031-identity-trust-root/tasks.md' | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(identity): close Phase 2 evidence ledger'
          git push origin HEAD:031-identity-trust-root
