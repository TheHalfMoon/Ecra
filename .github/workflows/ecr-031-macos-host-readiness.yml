name: ECR-031 macOS Host Readiness

on:
  push:
    branches:
      - 031-identity-trust-root

concurrency:
  group: ecr-031-host-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-readiness:
    name: macOS Data Protection app-like host readiness
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate T064 host script syntax
        shell: bash
        run: bash -n scripts/run-ecr031-macos-live-acceptance.sh

      - name: Require provisioning-authorized app-like host assets
        shell: bash
        run: bash scripts/run-ecr031-macos-live-acceptance.sh --readiness-only

      - name: Record Xcode account registry diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import sys

          path = Path.home() / "Library/Preferences/com.apple.dt.Xcode.plist"
          if not path.is_file():
              sys.exit(1)
          with path.open("rb") as handle:
              data = plistlib.load(handle)
          accounts = data.get("DVTDeveloperAccountManagerAppleIDLists")
          if not accounts:
              sys.exit(1)
          PY

      - name: Record Xcode development team registry diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import sys

          path = Path.home() / "Library/Preferences/com.apple.dt.Xcode.plist"
          if not path.is_file():
              sys.exit(1)
          with path.open("rb") as handle:
              data = plistlib.load(handle)
          teams = data.get("IDEProvisioningTeamByIdentifier") or data.get("IDEProvisioningTeams")
          if not isinstance(teams, dict) or not teams:
              sys.exit(1)
          PY
