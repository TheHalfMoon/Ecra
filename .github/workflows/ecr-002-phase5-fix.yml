name: ECR-002 Phase 5 SHA-256 repair

on:
  push:
    branches:
      - 002-durable-run-ledger

permissions:
  contents: write

jobs:
  repair-phase5:
    if: "${{ startsWith(github.event.head_commit.message, 'ci(run): permit phase5 rustfmt delta') }}"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Repair SHA-256 lowercase hex encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          store = Path('crates/ecra-run/src/store.rs')
          text = store.read_text()
          old = '''    let actual = Sha256::digest(bytes);\n    let actual_hex = format!("{actual:x}");\n    if actual_hex != digest.hex() {\n'''
          new = '''    let actual_hex = sha256_hex(bytes);\n    if actual_hex != digest.hex() {\n'''
          if text.count(old) != 1:
              raise SystemExit('store.rs SHA-256 block mismatch')
          text = text.replace(old, new, 1)
          text += '''\nfn sha256_hex(bytes: &[u8]) -> String {\n    const HEX: &[u8; 16] = b"0123456789abcdef";\n    let digest = Sha256::digest(bytes);\n    let mut hex = String::with_capacity(64);\n    for byte in digest {\n        hex.push(char::from(HEX[usize::from(byte >> 4)]));\n        hex.push(char::from(HEX[usize::from(byte & 0x0f)]));\n    }\n    hex\n}\n'''
          store.write_text(text)

          tests = Path('crates/ecra-run/tests/sqlite_store.rs')
          text = tests.read_text()
          old = '''fn sha256_digest(bytes: &[u8]) -> ContentDigest {\n    let hex = format!("{:x}", Sha256::digest(bytes));\n    ContentDigest::new("sha256", hex).expect("content digest")\n}\n'''
          new = '''fn sha256_digest(bytes: &[u8]) -> ContentDigest {\n    const HEX: &[u8; 16] = b"0123456789abcdef";\n    let digest = Sha256::digest(bytes);\n    let mut hex = String::with_capacity(64);\n    for byte in digest {\n        hex.push(char::from(HEX[usize::from(byte >> 4)]));\n        hex.push(char::from(HEX[usize::from(byte & 0x0f)]));\n    }\n    ContentDigest::new("sha256", hex).expect("content digest")\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('sqlite_store.rs SHA-256 helper mismatch')
          tests.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Verify Phase 5 focused gate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p ecra-run --test migration --locked
          cargo test -p ecra-run --test sqlite_store --locked
          cargo test -p ecra-run --test crash_recovery --locked
          cargo test -p ecra-run --locked
      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target
          rm .github/workflows/ecr-002-phase5-fix.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/ecr-002-phase5-fix.yml',
              'crates/ecra-run/src/sqlite.rs',
              'crates/ecra-run/src/store.rs',
              'crates/ecra-run/tests/sqlite_store.rs',
          }
          changed = {line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines() if line}
          if changed != allowed:
              raise SystemExit(f'unexpected changed paths: {sorted(changed)}')
          PY
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git commit -m 'fix(run): encode blob sha256 as lowercase hex'
          git push origin HEAD:002-durable-run-ledger
