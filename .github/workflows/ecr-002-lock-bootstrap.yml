name: ECR-002 Lock Committer

on:
  push:
    branches:
      - 002-durable-run-ledger
    paths-ignore:
      - Cargo.lock

permissions:
  contents: write

jobs:
  commit-lock:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 002-durable-run-ledger
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Verify event head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA" || {
            echo "refusing lock commit: event SHA $GITHUB_SHA, checkout $actual" >&2
            exit 1
          }
      - name: Generate and verify exact Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          expected="b720472bf40a554ab61afb74eae95dd625bc6b2604e47a632991faea630e42c6"
          actual="$(shasum -a 256 Cargo.lock | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "generated Cargo.lock digest drifted: expected $expected, found $actual" >&2
            exit 1
          }
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --check
          git diff --cached --quiet && {
            echo "Cargo.lock already matches the verified generated graph"
            exit 0
          }
          git commit -m "build(run): commit generated Cargo.lock"
          git push origin HEAD:002-durable-run-ledger

# Temporary trusted helper. It can modify Cargo.lock only. The push event created
# by the Cargo.lock-only commit is ignored, preventing a loop. Delete this file
# with the GitHub connector immediately after the generated lock commit lands.
