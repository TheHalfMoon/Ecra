name: ECR-002 Phase 6 build

on:
  push:
    branches:
      - 002-durable-run-ledger

permissions:
  contents: write

jobs:
  build-phase6:
    if: "${{ startsWith(github.event.head_commit.message, 'ci(run): rerun phase6 materializer') }}"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Materialize Phase 6 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ecr-002-phase6-materialize.py
          cargo fmt --all
      - name: Verify Phase 6 focused gate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test -p ecra-run --test attempts --locked
          cargo test -p ecra-run --test sqlite_store --locked
          cargo test -p ecra-run --test crash_recovery --locked
          cargo test -p ecra-run --locked
      - name: Commit Phase 6 candidate and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target
          rm .github/workflows/ecr-002-phase6-build.yml
          rm .github/ecr-002-phase6-materialize.py
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/ecr-002-phase6-materialize.py',
              '.github/workflows/ecr-002-phase6-build.yml',
              'crates/ecra-run/src/lib.rs',
              'crates/ecra-run/src/recovery.rs',
              'crates/ecra-run/src/store.rs',
              'crates/ecra-run/tests/attempts.rs',
              'crates/ecra-run/tests/crash_recovery.rs',
              'crates/ecra-run/tests/sqlite_store.rs',
          }
          changed = {line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines() if line}
          if changed != allowed:
              raise SystemExit(f'unexpected changed paths: {sorted(changed)}')
          PY
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git commit -m 'feat(run): implement attempt recovery guard'
          git push origin HEAD:002-durable-run-ledger
