name: ECR-031 Phase 3 closure ledger

on:
  push:
    branches:
      - 031-identity-trust-root

permissions:
  contents: write

jobs:
  close-phase3-ledger:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write exact-head closure ledger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "35df7cab41c85cf9f0c9e6f6b7d20c0a57b18d15"
          echo '' | base64 -d | python3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/031-identity-trust-root/tasks.md specs/031-identity-trust-root/STATUS.md EXECUTION.md
          git rm .github/workflows/ecr-031-phase3-close.yml
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m "docs(identity): close Phase 3 ledger"
          git push origin HEAD:031-identity-trust-root
