name: ECR-031 Phase 1 Lock Digest Capture

on:
  push:
    branches:
      - 031-identity-trust-root

permissions:
  contents: write

jobs:
  capture-lock-digest:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture Cargo.lock SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum Cargo.lock | awk '{print $1}' > specs/031-identity-trust-root/phase1-lock-sha256.txt
          else
            shasum -a 256 Cargo.lock | awk '{print $1}' > specs/031-identity-trust-root/phase1-lock-sha256.txt
          fi
          grep -Eq '^[0-9a-f]{64}$' specs/031-identity-trust-root/phase1-lock-sha256.txt

      - name: Commit digest and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ecr-031-phase1-evidence.yml
          git add .github/workflows/ecr-031-phase1-evidence.yml specs/031-identity-trust-root/phase1-lock-sha256.txt
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ecr-031-phase1-evidence.yml' 'specs/031-identity-trust-root/phase1-lock-sha256.txt' | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(identity): capture Phase 1 lock digest'
          git push origin HEAD:031-identity-trust-root
