name: ECR-031 Phase 1 Evidence Finalization

on:
  push:
    branches:
      - 031-identity-trust-root

permissions:
  contents: write

jobs:
  finalize-phase1-evidence:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify evidence base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0289596bb7cdbb81d5f03c445fd324e985294143 HEAD
          helper_delta="$(git diff --name-only 0289596bb7cdbb81d5f03c445fd324e985294143..HEAD | sort)"
          test "$helper_delta" = '.github/workflows/ecr-031-phase1-evidence.yml'
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          bash scripts/check-identity-unsafe.sh
          bash scripts/check-identity-deps.sh >/dev/null

      - name: Converge Phase 1 evidence ledger
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            LOCK_SHA="$(sha256sum Cargo.lock | awk '{print $1}')"
          else
            LOCK_SHA="$(shasum -a 256 Cargo.lock | awk '{print $1}')"
          fi
          export LOCK_SHA
          python3 - <<'PY'
          from pathlib import Path
          import os

          verified_head = "0289596bb7cdbb81d5f03c445fd324e985294143"
          verified_run = "33161529028"
          verified_job = "98816955646"
          lock_sha = os.environ["LOCK_SHA"]

          tasks_path = Path("specs/031-identity-trust-root/tasks.md")
          tasks = tasks_path.read_text()
          tasks = tasks.replace("**Status:** TASKS_READY", "**Status:** IMPLEMENTING", 1)
          for n in range(1, 11):
              old = f"- [ ] **T{n:03d}**"
              new = f"- [x] **T{n:03d}**"
              if old not in tasks:
                  raise SystemExit(f"missing expected task marker: {old}")
              tasks = tasks.replace(old, new, 1)
          tasks_path.write_text(tasks)

          status_path = Path("specs/031-identity-trust-root/STATUS.md")
          status = status_path.read_text()
          pending = "T009  PENDING exact-head permanent ECR-031 CI\nT010  PENDING exact-head dependency/license/native-boundary disposition after T009"
          complete = f"T009  COMPLETE — exact-head ECR-031 CI {verified_run} / job {verified_job} SUCCESS on {verified_head}\nT010  COMPLETE — locked dependency/license/native-boundary disposition recorded; Cargo.lock SHA-256 {lock_sha}"
          if pending not in status:
              raise SystemExit("STATUS Phase 1 pending block not found")
          status = status.replace(pending, complete, 1)
          status = status.replace("The Phase 1 implementation surface is now present, but it is **not yet declared T009 PASS** until a permanent ECR-031 workflow succeeds on the exact current head.", f"Phase 1 T001–T010 is complete against the verified implementation head `{verified_head}`. A final record-only convergence head must still pass the permanent ECR-031 workflow before semantic Phase 2 implementation begins.", 1)
          frontier_start = status.find("## Current execution frontier")
          if frontier_start < 0:
              raise SystemExit("STATUS frontier heading not found")
          next_heading = status.find("\n## ", frontier_start + 4)
          if next_heading < 0:
              next_heading = len(status)
          frontier = "## Current execution frontier\n\n1. run permanent ECR-031 CI on the record-only Phase 1 ledger-convergence head;\n2. require terminal `completed/success` on that exact head before semantic implementation;\n3. after the closure-head gate succeeds, begin T011 and continue Phase 2 strictly in dependency order;\n4. any dependency/feature/native-backend change requires a fresh reviewed disposition and exact-head evidence.\n"
          status = status[:frontier_start] + frontier + status[next_heading:]
          if "## Phase 1 verified closure evidence" in status:
              raise SystemExit("Phase 1 closure evidence already present")
          evidence_lines = [
              "",
              "## Phase 1 verified closure evidence",
              "",
              "```text",
              f"VERIFIED_PHASE1_HEAD      {verified_head}",
              f"ECR031_CI_RUN             {verified_run}",
              f"ECR031_CI_JOB             {verified_job}",
              "ECR031_CI_RESULT          SUCCESS",
              f"CARGO_LOCK_SHA256         {lock_sha}",
              "RUST_TOOLCHAIN            1.98.0",
              "DIRECT_V1_DEPENDENCIES    ecra-core, ed25519-dalek=3.0.0, chacha20poly1305=0.11.0, hkdf=0.13.0, sha2=0.11.0, zeroize=1.9.0, getrandom=0.4.3",
              "MACOS_NATIVE_DEPENDENCY   security-framework=3.7.0, target-specific, default-features=false, OSX_10_15",
              "WINDOWS_LINUX_BACKENDS    not adopted / not verified",
              "```",
              "",
              "The exact-head run passed stale-lock rejection, locked workspace build, rustfmt, strict Clippy, workspace tests, ECR-001/ECR-002 regressions, ECR-031 phase hooks, rustdoc, offline replay, core/run/identity boundary scripts, and dependency/toolchain evidence. This closes only the Phase 1 workspace/dependency/CI gate; it does not claim semantic identity, envelope, key-lifecycle, or native Keychain behavior is implemented.",
              "",
          ]
          status_path.write_text(status.rstrip() + "\n" + "\n".join(evidence_lines))

          donor_path = Path("research/donor-license-ledger.md")
          donor = donor_path.read_text()
          if "## ECR-031 Phase 1 Locked Dependency Evidence" in donor:
              raise SystemExit("donor Phase 1 locked evidence already present")
          donor_lines = [
              "",
              "## ECR-031 Phase 1 Locked Dependency Evidence",
              "",
              f"The accepted T001 candidates were promoted to the ECR-031 v1 Phase 1 locked dependency set only after Cargo generated the committed lock graph and the permanent workflow passed on exact head `{verified_head}` in ECR-031 CI run `{verified_run}`, job `{verified_job}`.",
              "",
              "```text",
              f"Cargo.lock SHA-256        {lock_sha}",
              "rustc / cargo             repository-pinned 1.98.0",
              "ed25519-dalek             =3.0.0, default-features=false, fast+zeroize",
              "chacha20poly1305          =0.11.0, default-features=false, alloc+zeroize",
              "hkdf                      =0.13.0, default-features=false",
              "sha2                      =0.11.0, default-features=false",
              "zeroize                   =1.9.0, default-features=false, alloc",
              "getrandom                 =0.4.3, default-features=false",
              "security-framework        =3.7.0, macOS target only, default-features=false, OSX_10_15",
              "security-framework-sys    2.17.0, transitive native/FFI boundary",
              "core-foundation           0.10.1, transitive Apple framework wrapper",
              "core-foundation-sys       0.8.7, transitive native/FFI boundary",
              "```",
              "",
              "`security-framework` / `security-framework-sys` and their CoreFoundation bridge remain reviewed dependency-owned Apple native/FFI boundaries; Ecra-authored `ecra-identity` Rust remains `#![forbid(unsafe_code)]`. No Windows DPAPI or Linux Secret Service backend dependency was adopted. `rand`/`rand_chacha` may appear elsewhere in workspace dev/test trees through the pre-existing ECR-001 `proptest` dev dependency, but they are absent from the normal `ecra-identity` dependency tree and are not an ECR-031 production RNG surface. No model/browser/network/protocol/policy/process framework entered the allowed identity runtime surface.",
              "",
              "Any future dependency, feature, native-boundary, or platform-backend change requires a new review and exact-head evidence rather than inheriting this disposition.",
              "",
              "**T010 disposition:** `LOCKED_DEPENDENCY_FOR_ECR031_V1_PHASE1`.",
              "",
          ]
          donor_path.write_text(donor.rstrip() + "\n" + "\n".join(donor_lines))

          execution_path = Path("EXECUTION.md")
          execution = execution_path.read_text()
          old_phase = "Current phase: Phase 1 — T001–T010\nCurrent task frontier: T001 dependency/license/advisory/MSRV review, then T002–T008"
          new_phase = f"Current phase: Phase 1 closure convergence — T001–T010 complete; Phase 2 blocked on final exact-head gate\nPhase 1 verified head: {verified_head}\nPhase 1 ECR-031 CI: {verified_run} / job {verified_job} — SUCCESS\nPhase 1 Cargo.lock SHA-256: {lock_sha}\nCurrent task frontier: final record-only Phase 1 convergence CI, then T011"
          if old_phase not in execution:
              raise SystemExit("EXECUTION current phase block not found")
          execution = execution.replace(old_phase, new_phase, 1)
          execution_path.write_text(execution)
          PY

      - name: Commit evidence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ecr-031-phase1-evidence.yml
          git add \
            .github/workflows/ecr-031-phase1-evidence.yml \
            EXECUTION.md \
            research/donor-license-ledger.md \
            specs/031-identity-trust-root/STATUS.md \
            specs/031-identity-trust-root/tasks.md
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/ecr-031-phase1-evidence.yml' \
            'EXECUTION.md' \
            'research/donor-license-ledger.md' \
            'specs/031-identity-trust-root/STATUS.md' \
            'specs/031-identity-trust-root/tasks.md' | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(identity): close Phase 1 evidence ledger'
          git push origin HEAD:031-identity-trust-root
