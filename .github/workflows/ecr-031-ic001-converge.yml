name: ECR-031 IC-001 dependency convergence

on:
  push:
    branches:
      - 031-identity-trust-root

permissions:
  contents: write

jobs:
  converge-ic001:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Converge implementation dependency plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~3)" = "7eaede3f9f10461c307c8900c021273a4dbffa03"
          python3 .github/scripts/ecr031_ic001.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/031-identity-trust-root/implementation-clarifications.md specs/031-identity-trust-root/tasks.md specs/031-identity-trust-root/plan.md specs/031-identity-trust-root/analyze.md specs/031-identity-trust-root/STATUS.md EXECUTION.md
          git rm .github/workflows/ecr-031-ic001-converge.yml .github/scripts/ecr031_ic001.py
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m "docs(identity): remediate Phase 4 dependency graph"
          git push origin HEAD:031-identity-trust-root
