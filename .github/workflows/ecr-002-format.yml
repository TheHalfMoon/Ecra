name: ECR-002 One-Shot Rustfmt

on:
  push:
    branches:
      - 002-durable-run-ledger
    paths:
      - .github/workflows/ecr-002-format.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 002-durable-run-ledger
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format ECR-002 Rust sources
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff -- crates/ecra-run
      - name: Commit formatter output if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ecra-run
          if git diff --cached --quiet; then
            echo "No rustfmt changes required"
            exit 0
          fi
          git commit -m "style(run): apply rustfmt to event contract"
          git push origin HEAD:002-durable-run-ledger

# Temporary trusted formatting helper. It is triggered only by creation/change
# of this workflow and may commit only crates/ecra-run formatter output. Delete
# immediately after the one-shot run completes.
