name: ECR-004 Lockfile Bootstrap

on:
  push:
    branches:
      - 004-verification-receipts-impl

concurrency:
  group: ecr-004-lockfile-bootstrap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 004-verification-receipts-impl
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal
      - name: Generate only Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain)"
          test -z "$before"
          cargo generate-lockfile
          changed="$(git status --porcelain)"
          if [[ -z "$changed" ]]; then
            echo "Cargo.lock already current"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Ev '^ M Cargo.lock$' >/dev/null; then
            echo "lockfile bootstrap changed a path other than Cargo.lock" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git diff --check -- Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(verify): regenerate workspace lockfile'
          git push origin HEAD:004-verification-receipts-impl
