name: ECR-002 Phase 6 ledger

on:
  push:
    branches:
      - 002-durable-run-ledger

permissions:
  contents: write

jobs:
  record-phase6:
    if: "${{ startsWith(github.event.head_commit.message, 'ci(run): record phase6 ledger') }}"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record Phase 6 verification and activate Phase 7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          tasks = Path('specs/002-durable-run-ledger/tasks.md')
          text = tasks.read_text()
          for task in range(45, 52):
              pattern = rf'(?m)^- \[ \] T{task:03d} '
              text, count = re.subn(pattern, f'- [x] T{task:03d} ', text)
              if count != 1:
                  raise SystemExit(f'T{task:03d} checkbox replacement count={count}')
          tasks.write_text(text)

          status = Path('specs/002-durable-run-ledger/STATUS.md')
          text = status.read_text()
          marker = '## Current implementation position\n'
          if text.count(marker) != 1:
              raise SystemExit('current position marker mismatch')
          phase6 = '''## Phase 6 — VERIFIED_ON_BRANCH\n\nT045–T051 are complete on the exact verified Phase 6 head:\n\n```text\nexact head  04d51e913c88e38d2730950e711ab498a3b6e296\nCI run      33146742762 — SUCCESS\njob         run-ledger / 98769387841 — SUCCESS\n```\n\nThe exact-head gate passed locked build, rustfmt, strict Clippy, workspace tests, ECR-001 regression targets, explicit ECR-002 attempt/SQLite/crash-recovery targets, rustdoc, offline replay, and both boundary suites.\n\nPhase 6 establishes durable prepare-before-effect guards, exact-bound receipt persistence, recovery scanning plus explicit recovery boundaries, ECR-001-preserving retry refusal, crash matrix A–D with UNKNOWN/no-fabrication evidence, distinct attempts for one action, and two-connection expected-head concurrency where only one competing append succeeds.\n\n'''
          text = text.replace(marker, phase6 + marker, 1)
          old_position = '''Phase 1 T001–T008  VERIFIED_ON_BRANCH\nPhase 2 T009–T018  VERIFIED_ON_BRANCH\nPhase 3 T019–T026  VERIFIED_ON_BRANCH\nPhase 4 T027–T034  VERIFIED_ON_BRANCH\nPhase 5 T035–T044  VERIFIED_ON_BRANCH\nPhase 6 T045–T051  ACTIVE\nPhase 7 T052–T059  blocked by Phase 6 exact-head verification\nPhase 8 T060–T066  blocked\nPhase 9 T067–T073  blocked\n'''
          new_position = '''Phase 1 T001–T008  VERIFIED_ON_BRANCH\nPhase 2 T009–T018  VERIFIED_ON_BRANCH\nPhase 3 T019–T026  VERIFIED_ON_BRANCH\nPhase 4 T027–T034  VERIFIED_ON_BRANCH\nPhase 5 T035–T044  VERIFIED_ON_BRANCH\nPhase 6 T045–T051  VERIFIED_ON_BRANCH\nPhase 7 T052–T059  ACTIVE\nPhase 8 T060–T066  blocked by Phase 7 exact-head verification\nPhase 9 T067–T073  blocked\n'''
          if text.count(old_position) != 1:
              raise SystemExit('current position block mismatch')
          text = text.replace(old_position, new_position, 1)
          old_gate = 'Phase 6 semantic mutation starts only after a full exact-head ECR-002 gate passes on this Phase 5 ledger state.\n\nPhase 6 candidate implementation was materialized and passed its focused pre-commit gate at implementation commit `2105f1f4853b7c7b4f0a48484ba635d0eddbdd67`; T045–T051 remain ACTIVE until the permanent full exact-head gate passes on the candidate-plus-ledger head.\n\n'
          if text.count(old_gate) != 1:
              raise SystemExit('phase6 candidate gate text mismatch')
          text = text.replace(old_gate, '', 1)
          old_work = '''T045 durable prepare_attempt store API\nT046 exact-bound record_receipt store API\nT047 recovery scan + explicit recovery-boundary append\nT048 ECR-001-preserving retry guard + unresolved blind-retry block\nT049 crash matrix A–D\nT050 multiple-attempt/one-action distinctness + receipt cross-bind rejection\nT051 two-connection expected-head concurrency\n'''
          new_work = '''T052 strict archive manifest/path/metadata model + hard limits\nT053 deterministic Stored-only writer\nT054 archive reader safety/profile preflight\nT055 manifest whitelist + digest/event/ledger/reducer validation\nT056 deterministic export golden/hash\nT057 malicious archive corpus\nT058 malformed manifest/event/content/ledger failures\nT059 prove SQLite/WAL are never exported + synthetic-only fixtures\n'''
          if text.count(old_work) != 1:
              raise SystemExit('immediate work block mismatch')
          status.write_text(text.replace(old_work, new_work, 1))
          PY
      - name: Commit ledger and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ecr-002-phase6-ledger.yml
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/ecr-002-phase6-ledger.yml',
              'specs/002-durable-run-ledger/STATUS.md',
              'specs/002-durable-run-ledger/tasks.md',
          }
          changed = {line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines() if line}
          if changed != allowed:
              raise SystemExit(f'unexpected changed paths: {sorted(changed)}')
          PY
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git commit -m 'docs(run): record phase6 exact-head verification'
          git push origin HEAD:002-durable-run-ledger
