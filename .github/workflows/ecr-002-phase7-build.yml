name: ECR-002 Phase 7 build

on:
  push:
    branches:
      - 002-durable-run-ledger

permissions:
  contents: write

jobs:
  build-phase7:
    if: "${{ startsWith(github.event.head_commit.message, 'ci(run): repair phase7 duplicate corpus') }}"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Materialize Phase 7 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ecr-002-phase7-materialize.py
          python3 - <<'PY'
          from pathlib import Path

          source = Path('crates/ecra-run/src/archive.rs')
          text = source.read_text()
          repairs = [
              ('!file.extra_data().is_empty()', 'file.extra_data().is_some_and(|data| !data.is_empty())'),
              ('path.as_bytes().len() > MAX_PATH_BYTES', 'path.len() > MAX_PATH_BYTES'),
          ]
          for old, new in repairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one archive repair site for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          source.write_text(text)

          test = Path('crates/ecra-run/tests/archive.rs')
          text = test.read_text()
          repairs = [
              (
                  'assert!(file.extra_data().is_empty());',
                  'assert!(file.extra_data().is_none_or(|data| data.is_empty()));',
              ),
              (
                  '''    let duplicate = zip_entries(&[("manifest.v1.json", b"{}"), ("manifest.v1.json", b"{}")]);
    let error = read_ecra(&duplicate).expect_err("duplicate entry must fail");
    assert_eq!(error.code(), RunErrorCode::ArchiveDuplicateEntry);''',
                  '''    let mut duplicate = zip_entries(&[("manifest.v1.json", b"{}"), ("manifest.v2.json", b"{}")]);
    let old_name = b"manifest.v2.json";
    let new_name = b"manifest.v1.json";
    let mut replacements = 0_usize;
    let mut index = 0_usize;
    while index + old_name.len() <= duplicate.len() {
        if &duplicate[index..index + old_name.len()] == old_name {
            duplicate[index..index + old_name.len()].copy_from_slice(new_name);
            replacements += 1;
            index += old_name.len();
        } else {
            index += 1;
        }
    }
    assert_eq!(replacements, 2, "local and central ZIP names must both be patched");
    let error = read_ecra(&duplicate).expect_err("duplicate entry must fail");
    assert_eq!(error.code(), RunErrorCode::ArchiveDuplicateEntry);''',
              ),
          ]
          for old, new in repairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one archive test repair site for {old[:48]!r}, found {count}')
              text = text.replace(old, new, 1)
          test.write_text(text)
          PY
          cargo fmt --all
      - name: Compile and lint archive candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Materialize deterministic archive golden
        shell: bash
        env:
          ECRA_WRITE_ARCHIVE_GOLDEN: "1"
        run: cargo test -p ecra-run --test archive deterministic_export_roundtrip_and_golden_hash --locked -- --exact
      - name: Verify Phase 7 focused gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ecra-run --test archive --locked
          cargo test -p ecra-run --test boundaries --locked
          cargo test -p ecra-run --test event_contract --locked
          cargo test -p ecra-run --test reducer --locked
          cargo test -p ecra-run --test attempts --locked
          cargo test -p ecra-run --test budgets --locked
          cargo test -p ecra-run --test migration --locked
          cargo test -p ecra-run --test sqlite_store --locked
          cargo test -p ecra-run --test crash_recovery --locked
          cargo test -p ecra-run --test portability --locked
          cargo test -p ecra-run --locked
      - name: Commit Phase 7 candidate and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target
          rm .github/workflows/ecr-002-phase7-build.yml
          rm .github/ecr-002-phase7-materialize.py
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/ecr-002-phase7-materialize.py',
              '.github/workflows/ecr-002-phase7-build.yml',
              'contracts/ecra-run-v1/expected/archive-golden.v1.ecra',
              'contracts/ecra-run-v1/expected/archive-golden.v1.sha256',
              'crates/ecra-run/src/archive.rs',
              'crates/ecra-run/src/lib.rs',
              'crates/ecra-run/tests/archive.rs',
              'crates/ecra-run/tests/boundaries.rs',
          }
          changed = {line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines() if line}
          if changed != allowed:
              raise SystemExit(f'unexpected changed paths: {sorted(changed)}')
          PY
          git config user.name 'Abdulaziz M. Shehri'
          git config user.email 'alshehriofficial@gmail.com'
          git add -A
          git commit -m 'feat(run): implement deterministic ecra archive'
          git push origin HEAD:002-durable-run-ledger
