name: ECR-001 CI

on:
  push:
    branches:
      - 001-trusted-domain-kernel
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'contracts/ecra-domain-v1/**'
      - 'scripts/check-core-deps.sh'
      - '.github/workflows/ecr-001.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Build locked workspace
        run: cargo build --workspace --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Rustdoc tests
        run: cargo test --doc --workspace --locked
      - name: Offline replay gate
        run: cargo test --workspace --locked --offline
      - name: Dependency boundary
        run: bash scripts/check-core-deps.sh
