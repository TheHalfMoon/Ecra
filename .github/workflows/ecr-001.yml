name: ECR-001 CI

on:
  push:
    branches:
      - 001-trusted-domain-kernel
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'contracts/ecra-domain-v1/**'
      - 'scripts/check-core-deps.sh'
      - '.github/workflows/ecr-001.yml'

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Generate lockfile for bootstrap
        run: cargo generate-lockfile
      - name: Commit bootstrap Cargo.lock when missing or changed
        if: github.event_name == 'push'
        run: |
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: pin ECR-001 Cargo.lock'
          git push origin HEAD:001-trusted-domain-kernel
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Rustdoc tests
        run: cargo test --doc --workspace
      - name: Dependency boundary
        run: bash scripts/check-core-deps.sh
