name: ECR-031 T045 formatting convergence

on:
  push:
    branches:
      - 031-identity-trust-root

permissions:
  contents: write

jobs:
  converge-t045:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Converge T045 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6b4b353bdc4a0b8bded4dd9048be27d12bd1abbe"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/ecra-identity/src/envelope.rs")
          source = path.read_text()
          old = "    pub(crate) fn from_ciphertext(\n"
          new = "    #[allow(dead_code)]\n    pub(crate) fn from_ciphertext(\n"
          if source.count(old) != 1:
              raise SystemExit("from_ciphertext signature not unique")
          path.write_text(source.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ecra-identity/src/envelope.rs
          git rm .github/workflows/ecr-031-t045-format.yml
          git diff --cached --check
          git commit -m "style(identity): converge T045 envelope source"
          git push origin HEAD:031-identity-trust-root
